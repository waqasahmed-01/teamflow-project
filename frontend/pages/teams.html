<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Teams - TeamFlow</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
          TeamFlow
        </a>

        <div class="d-flex align-items-center gap-3">
          <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">
            Dashboard
          </a>

          <button id="logoutButton" class="btn btn-outline-danger btn-sm">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="fw-bold mb-1">My Teams</h1>

          <p class="text-muted mb-0">Teams you belong to.</p>
        </div>

        <button id="createTeamButton" class="btn btn-primary">
          Create Team
        </button>
      </div>

      <!-- Teams Container -->
      <div id="teamsContainer" class="row g-4">
        <div class="col-12 text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>

          <p class="text-muted mt-3">Loading teams...</p>
        </div>
      </div>
    </main>
    <!-- Create Team Modal -->
    <div
      class="modal fade"
      id="createTeamModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Create Team</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <form id="createTeamForm">
            <div class="modal-body">
              <div class="mb-3">
                <label for="teamName" class="form-label"> Team Name </label>

                <input
                  type="text"
                  id="teamName"
                  class="form-control"
                  placeholder="e.g. Engineering Team"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="teamDescription" class="form-label">
                  Description
                </label>

                <textarea
                  id="teamDescription"
                  class="form-control"
                  rows="3"
                  placeholder="What is this team responsible for?"
                ></textarea>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>

              <button
                type="submit"
                id="createTeamSubmitButton"
                class="btn btn-primary"
              >
                Create Team
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/teams.js"></script>
  </body>
</html>
