<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Team Details - TeamFlow</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
          TeamFlow
        </a>

        <div class="d-flex align-items-center gap-3">
          <a href="teams.html" class="btn btn-outline-secondary btn-sm">
            My Teams
          </a>

          <button id="logoutButton" class="btn btn-outline-danger btn-sm">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">
      <!-- Back -->
      <div class="mb-4">
        <a href="teams.html" class="text-decoration-none"> ← Back to Teams </a>
      </div>

      <!-- Team Details -->
      <div id="teamDetailsContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>

          <p class="text-muted mt-3">Loading team...</p>
        </div>
      </div>

      <!-- Team Members -->
      <div id="teamMembersSection" class="card border-0 shadow-sm mt-4">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h4 class="fw-bold mb-1">Team Members</h4>

              <p class="text-muted mb-0">People who are part of this team.</p>
            </div>

            <button id="addMemberButton" class="btn btn-primary">
              Add Member
            </button>
          </div>

          <div id="teamMembersContainer">
            <div class="text-center py-4">
              <div
                class="spinner-border spinner-border-sm text-primary"
                role="status"
              ></div>

              <span class="text-muted ms-2"> Loading members... </span>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- Add Member Modal -->
    <div
      class="modal fade"
      id="addMemberModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Team Member</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <form id="addMemberForm">
            <div class="modal-body">
              <div class="mb-3">
                <label for="memberUserId" class="form-label"> User ID </label>

                <input
                  type="text"
                  id="memberUserId"
                  class="form-control"
                  placeholder="Enter user ID"
                  required
                />

                <div class="form-text">
                  Enter the ObjectId of the user you want to add.
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>

              <button
                type="submit"
                id="addMemberSubmitButton"
                class="btn btn-primary"
              >
                Add Member
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/team-details.js"></script>
  </body>
</html>
